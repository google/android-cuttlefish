name: Darwin qemu probe

# Experiment: does HVF work on a hosted macOS runner, and how long does
# a boot take with and without it? Boots a stock Debian cloud image to
# its login prompt under each accelerator and reports the times. Does
# not build or use cuttlefish at all.

on:
  pull_request:
  push:
    branches-ignore:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qemu-probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
    - name: Install qemu
      run: brew install qemu
      shell: bash
    - name: Describe the runner
      run: |
        sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
        sysctl kern.hv_support || true
        qemu-system-x86_64 --version
        qemu-system-x86_64 -accel help
      shell: bash
    - name: Fetch a Debian cloud image
      run: |
        curl -fsSLo disk.qcow2 \
          https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2
        qemu-img info disk.qcow2
      shell: bash
    - name: Boot to the login prompt under each accelerator
      run: |
        # boot <accel> <cpu>: prints the time to the login prompt, or
        # why it did not get there. Returns 1 on failure.
        boot() {
          local start; start=$(date +%s)
          rm -f "serial-$1.log"
          qemu-system-x86_64 -accel "$1" -machine q35 -cpu "$2" \
            -smp "$(sysctl -n hw.ncpu)" -m 2048 \
            -drive file=disk.qcow2,if=virtio -snapshot \
            -netdev user,id=n0 -device virtio-net-pci,netdev=n0 \
            -display none -serial "file:serial-$1.log" 2> "qemu-$1.err" &
          local qemu=$!
          # Fail after 20 minutes so the job budget is not spent waiting.
          for _ in $(seq 1200); do
            if grep -q 'login:' "serial-$1.log" 2>/dev/null; then
              echo "$1: login prompt after $(( $(date +%s) - start ))s"
              kill "$qemu"
              return 0
            fi
            if ! kill -0 "$qemu" 2>/dev/null; then
              echo "$1: qemu exited before the login prompt:"
              cat "qemu-$1.err"
              return 1
            fi
            sleep 1
          done
          echo "$1: no login prompt after 20 minutes"
          kill "$qemu" 2>/dev/null || true
          return 1
        }
        # HVF may not work inside the runner VM even though the kernel
        # reports hv_support; that is one of the things being measured.
        boot hvf host || true
        boot tcg max
      shell: bash
    - name: Serial logs
      if: always()
      run: |
        for f in serial-*.log; do
          echo "::group::$f"; cat "$f"; echo "::endgroup::"
        done
      shell: bash
