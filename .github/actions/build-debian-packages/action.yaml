name: 'Build debian packages for Cuttlefish host'
inputs:
  debian-version:
    required: false
  image-version:
    required: false
  package:
    required: true
runs:
  using: "composite"
  steps:
  - name: Modify version format
    if: inputs.debian-version != ''
    run: |
      FILES=(
        "base/debian/changelog"
        "container/debian/changelog"
        "frontend/debian/changelog"
        "cuttlefish-integration-gigabyte-arm64/debian/changelog"
      )

      for FILE in "${FILES[@]}"; do
        sed -i "1s/(\([0-9]\+.[0-9]\+.[0-9]\+\))/(${INPUTS_DEBIAN_VERSION})/g" "$FILE"
      done
    shell: bash
    env:
      INPUTS_DEBIAN_VERSION: ${{ inputs.debian-version }}
  - name: Build CF debian packages
    run: |
      IMAGE_OPT=""
      if [ -n "${INPUTS_IMAGE_VERSION}" ]; then
        IMAGE_OPT="-e container_image_name=us-docker.pkg.dev/android-cuttlefish-artifacts/cuttlefish-orchestration/cuttlefish-orchestration:${INPUTS_IMAGE_VERSION}"
      fi

      case "${INPUTS_PACKAGE}" in
        container)
          # Build cuttlefish-podcvd package with Debian 13 (Trixie)
          sudo docker build \
            --file "tools/buildutils/cw/Containerfile" \
            --build-arg BASE_IMAGE=mirror.gcr.io/library/debian:13 \
            --tag "android-cuttlefish-build-trixie" \
            .
          sudo docker run \
            ${IMAGE_OPT} \
            -v=$PWD:/mnt/build \
            -w /mnt/build \
            android-cuttlefish-build-trixie \
            container
          ;;
        base)
          # Build other packages with Debian 12 (Bookworm)
          sudo docker build \
            --file "tools/buildutils/cw/Containerfile" \
            --tag "android-cuttlefish-build" \
            .
          # Pre-fetch git_repository deps into base/cvd/vendor_src (cached by
          # mount-bazel-vendor-cache) so the debuild below needs no git access.
          sudo docker run \
            -v=$PWD:/mnt/build \
            -w /mnt/build \
            --entrypoint tools/buildutils/vendor_git_repos.sh \
            android-cuttlefish-build
          sudo docker run \
            -v=$PWD:/mnt/build \
            -w /mnt/build \
            -v=$HOME/bazel-disk-cache:/root/bazel-disk-cache \
            android-cuttlefish-build \
            base -d /root/bazel-disk-cache
          ;;
        *)
          # Build other packages with Debian 12 (Bookworm)
          sudo docker build \
            --file "tools/buildutils/cw/Containerfile" \
            --tag "android-cuttlefish-build" \
            .
          sudo docker run \
            -v=$PWD:/mnt/build \
            -w /mnt/build \
            android-cuttlefish-build \
            "${INPUTS_PACKAGE}"
          ;;
      esac
    shell: bash
    env:
      INPUTS_IMAGE_VERSION: ${{ inputs.image-version }}
      INPUTS_PACKAGE: ${{ inputs.package }}
