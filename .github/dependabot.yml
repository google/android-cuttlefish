version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/frontend/src/host_orchestrator"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0  # keep security updates only
    cooldown:
      default-days: 7

  - package-ecosystem: "gomod"
    directory: "/e2etests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
