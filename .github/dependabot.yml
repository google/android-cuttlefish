version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/frontend/src/host_orchestrator"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0  # keep security updates only
    ignore:
      # Block bumps that require Go 1.21+ / 1.25+ in host_orchestrator/go.mod
      - dependency-name: "google.golang.org/grpc"
        versions: [">=1.63.0"]
      - dependency-name: "golang.org/x/net"
        versions: [">=0.21.0"]
    cooldown:
      default-days: 7

  - package-ecosystem: "gomod"
    directory: "/frontend/src/operator"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0  # keep security updates only
    ignore:
      # Block bumps that require Go 1.21+ / 1.25+ in operator/go.mod (go 1.17)
      - dependency-name: "google.golang.org/grpc"
        versions: [">=1.63.0"]
      - dependency-name: "golang.org/x/net"
        versions: [">=0.21.0"]
    cooldown:
      default-days: 7

  - package-ecosystem: "gomod"
    directory: "/frontend/src/liboperator"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0  # keep security updates only
    ignore:
      # Block bumps that require Go 1.21+ / 1.25+ in liboperator/go.mod (go 1.17)
      - dependency-name: "google.golang.org/grpc"
        versions: [">=1.63.0"]
      - dependency-name: "golang.org/x/net"
        versions: [">=0.21.0"]
    cooldown:
      default-days: 7

  - package-ecosystem: "gomod"
    directory: "/frontend/src/libhoclient"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0  # keep security updates only
    ignore:
      # Block bumps that require newer Go in libhoclient/go.mod (go 1.18)
      - dependency-name: "golang.org/x/crypto"
        versions: [">=0.22.0"]
      - dependency-name: "golang.org/x/net"
        versions: [">=0.24.0"]
    cooldown:
      default-days: 7

  - package-ecosystem: "gomod"
    directory: "/e2etests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "golang.org/x/crypto"
        versions: [">=0.50.0"]
      - dependency-name: "golang.org/x/net"
        versions: [">=0.52.0"]
    cooldown:
      default-days: 7
