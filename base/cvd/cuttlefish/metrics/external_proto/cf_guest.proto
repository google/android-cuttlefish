edition = "2023";

package logs.proto.wireless.android.cuttlefish.events;

import "cuttlefish/metrics/external_proto/cf_flags.proto";
import "google/protobuf/cpp_features.proto";

option features.(pb.cpp).string_type = VIEW;

// A Cuttlefish guest device running in a virtual machine.
//
// See go/cf-metrics-prd-v2 for more information.
//
// Next index: 9
message CuttlefishGuest {
  // The newest event to happen to this guest virtual machine that was not
  // already reported in a previous metrics message.
  // Next index: 7
  enum EventType {
    // Unknown event, or no event occurred on this guest since the last metrics
    // message.
    CUTTLEFISH_GUEST_EVENT_TYPE_UNSPECIFIED = 0;

    // `cvd create`, the device is added to the local instance database
    CUTTLEFISH_GUEST_EVENT_TYPE_VM_INSTANTIATION = 1;

    // The guest writes VIRTUAL_DEVICE_BOOT_COMPLETED to the kernel log.
    CUTTLEFISH_GUEST_EVENT_TYPE_DEVICE_BOOT_COMPLETED = 2;

    // The lock screen is rendered and interactive.
    CUTTLEFISH_GUEST_EVENT_TYPE_LOCK_SCREEN_AVAILABLE = 3;

    // User stopped the virtual machine with `cvd stop`/`stop_cvd`. Not every
    // device that is created will necessarily be shut down this way, users may
    // `pkill` or `ctrl-c` these devices.
    CUTTLEFISH_GUEST_EVENT_TYPE_VM_STOP = 4;

    // `cvd` is invoking `cvd_internal_start` / `launch_cvd`.
    CUTTLEFISH_GUEST_EVENT_TYPE_DEVICE_BOOT_START = 5;

    // The instance failed to boot for whatever reason.
    CUTTLEFISH_GUEST_EVENT_TYPE_DEVICE_BOOT_FAILED = 6;
  }

  // Deterministic failure category when the guest fails to boot
  // (event_type == CUTTLEFISH_GUEST_EVENT_TYPE_DEVICE_BOOT_FAILED).
  // Next index: 11
  enum BootFailureCategory {
    CUTTLEFISH_GUEST_BOOT_FAILURE_CATEGORY_UNSPECIFIED = 0;

    // assemble_cvd failed before run_cvd started.
    CUTTLEFISH_GUEST_BOOT_FAILURE_CATEGORY_ASSEMBLY_FAILURE = 1;

    // The Virtual Machine Manager (e.g. crosvm, qemu) exited with an error.
    CUTTLEFISH_GUEST_BOOT_FAILURE_CATEGORY_VMM_FAILURE = 2;

    // A monitored host subprocess (e.g. webRTC, openwrt, netsimd) crashed or
    // exited unexpectedly before shutdown.
    CUTTLEFISH_GUEST_BOOT_FAILURE_CATEGORY_HOST_SUBPROCESS_CRASH = 3;

    // The VMM started, but neither bootloader nor kernel output was reached.
    CUTTLEFISH_GUEST_BOOT_FAILURE_CATEGORY_PRE_BOOTLOADER_FAILURE = 4;

    // The bootloader (e.g. U-Boot) started, but the guest kernel was never
    // reached.
    CUTTLEFISH_GUEST_BOOT_FAILURE_CATEGORY_BOOTLOADER_FAILURE = 5;

    // The guest kernel started and experienced a kernel panic or oops.
    CUTTLEFISH_GUEST_BOOT_FAILURE_CATEGORY_KERNEL_PANIC = 6;

    // The guest kernel started, but Android init was never reached.
    CUTTLEFISH_GUEST_BOOT_FAILURE_CATEGORY_KERNEL_HANG = 7;

    // Guest userspace (e.g. system_server or an init critical/updatable
    // service) crashed during boot.
    CUTTLEFISH_GUEST_BOOT_FAILURE_CATEGORY_USERSPACE_CRASH = 8;

    // Kernel and init started without detected crashes, but timed out before
    // VIRTUAL_DEVICE_BOOT_STARTED.
    CUTTLEFISH_GUEST_BOOT_FAILURE_CATEGORY_BOOT_TIMEOUT_PRE_BOOT_STARTED = 9;

    // VIRTUAL_DEVICE_BOOT_STARTED was reached without detected crashes, but
    // timed out before VIRTUAL_DEVICE_BOOT_COMPLETED.
    CUTTLEFISH_GUEST_BOOT_FAILURE_CATEGORY_BOOT_TIMEOUT_POST_BOOT_STARTED = 10;
  }

  // The newest event to happen to this guest virtual machine that was not
  // already reported in a previous metrics message.
  EventType event_type = 1;

  string guest_id = 2;

  // Free-text operating system version for the guest.
  // Ex. Android version (9.x, 10.x, etc.) or `uname -r` output
  string guest_os_version = 3;

  // Android API level: https://developer.android.com/tools/releases/platforms
  int32 guest_api_level = 4;

  // Free-text version information about the Virtual Machine Manager running
  // this guest.
  string vmm_version = 6;

  CuttlefishFlags flags = 7;

  // Deterministic failure category when the instance fails to boot.
  BootFailureCategory boot_failure_category = 8;
}
