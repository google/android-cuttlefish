# Override GCE /etc/sysctl.d/60-gce-network-security.conf (net.ipv4.ip_forward = 0)
# at early boot and during systemd-sysctl reloads so Cuttlefish guest traffic is
# routed and docker.service does not set iptables -P FORWARD DROP.
# Set default.accept_ra = 2 so newly created host interfaces keep accepting
# Router Advertisements after cuttlefish-host-resources enables IPv6 forwarding.
net.ipv4.ip_forward = 1
net.ipv6.conf.default.accept_ra = 2
